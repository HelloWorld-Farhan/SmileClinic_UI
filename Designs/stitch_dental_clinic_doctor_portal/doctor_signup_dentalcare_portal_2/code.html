<body class="bg-surface font-body-md text-on-surface antialiased">
<main class="relative min-h-screen flex flex-col items-center justify-center p-space-gutter overflow-hidden bg-gradient-to-br from-primary-fixed/30 via-surface to-secondary-fixed/20">
<!-- Decorative background elements -->
<div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-primary-fixed/30 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-secondary-fixed/40 blur-3xl pointer-events-none"></div>
<div class="w-full max-w-xl bg-surface-container-lowest rounded-2xl shadow-2xl p-space-xl relative z-10 border border-outline-variant/20">
<!-- Header Info -->
<div class="text-center mb-space-lg">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-primary-container/10 text-primary mb-space-md shadow-inner overflow-hidden p-2">
<img alt="Dental Care Logo" class="w-full h-full object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1VBMQbDrhUnOYcpY7XlxeYntotjue9k6Ag-gX-3CiHSPTpJf89vb_82BHB2ffK_RcbYdpAFJEVIjz5-56hqT75H5mGUhKeGwWUthXA4Tp5fMjc75HLWqT1tFFHyjfVgibStaNcH8TPe972CKU8tRiDXiWxYRIQhxzrhDuqhES3CzfT2UJRm6BxY2BEFiR_aZouUmSR-ZStKOw4KgllTTN1fJGTg-tJp718cFbXLjt4AUL_5Z3-JrbpI_kM"/>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-space-xs tracking-tight">Doctor Registration</h1>
<p class="text-body-md text-on-surface-variant">Join the Dental Clinic Pro clinical network to manage patients and treatments securely.</p>
</div>
<!-- Signup Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
<!-- Full Name -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all" placeholder="Dr. Priya Patel" required="" type="text"/>
</div>
</div>
<!-- NPI / License -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Medical License / NPI</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">badge</span>
</span>
<input class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all" placeholder="NPI-9834210" required="" type="text"/>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
<!-- Email -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Professional Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all" placeholder="s.jenkins@Dental Clinic.org" required="" type="email"/>
</div>
</div>
<!-- Specialization -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Specialization</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">medical_services</span>
</span>
<select class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all appearance-none cursor-pointer" required="">
<option disabled="" selected="" value="">Select Specialization</option>
<option value="orthodontics">Orthodontics</option>
<option value="endodontics">Endodontics</option>
<option value="periodontics">Periodontics</option>
<option value="oral-surgery">Oral &amp; Maxillofacial Surgery</option>
<option value="pediatric">Pediatric Dentistry</option>
<option value="general">General Dentistry</option>
</select>
<span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</span>
</div>
</div>
</div>
<!-- Clinic Name -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Clinic / Practice Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">local_hospital</span>
</span>
<input class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all" placeholder="Advanced Dental Care Center" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-space-xs">
<label class="block text-label-lg font-label-lg text-on-surface">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-10 pr-space-md py-space-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-[#007782] transition-all" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms agreement checkbox -->
<div class="flex items-start pt-space-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded text-[#007782] focus:ring-[#007782] accent-[#007782] bg-surface-container-low cursor-pointer" id="terms" required="" type="checkbox"/>
</div>
<div class="ml-space-sm text-body-sm">
<label class="text-on-surface-variant cursor-pointer" for="terms">
I agree to the <a class="text-[#007782] hover:underline font-medium" href="#">Clinical Terms of Service</a> and <a class="text-[#007782] hover:underline font-medium" href="#">HIPAA Privacy Compliance Protocol</a>.
</label>
</div>
</div>
<!-- Create Account Button -->
<button class="w-full py-space-md bg-[#007782] text-on-primary rounded-xl font-label-lg text-label-lg hover:bg-opacity-95 transition-all shadow-md flex items-center justify-center gap-space-sm mt-space-md cursor-pointer" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Switch to Login -->
<div class="text-center pt-space-sm">
<p class="text-body-md text-on-surface-variant">
Already have a clinical account? 
<a class="text-[#007782] font-semibold hover:underline ml-1" href="../doctor_login_dentalcare_portal_2/code.html">Sign In</a>
</p>
</div>
</form>
</div>
</main>

        <span class="material-symbols-outlined">home</span>
        Back to Home
    </a>
